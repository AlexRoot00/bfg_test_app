services:
  db:
    image: postgres:17-alpine
    container_name: notes-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: change-me-please

    volumes:
      - ./data/postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: ./test_app
      dockerfile: ../Dockerfile

    container_name: notes-app
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: notes
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: change-me-please

      APP_PORT: 8000
      LOG_LEVEL: INFO
      SHUTDOWN_DELAY_SECONDS: 3

    ports:
      - "8000:8000"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
